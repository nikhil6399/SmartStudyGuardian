name: Android CI - Debug & Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Build Release APK & Play Store AAB'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  debug-build-and-test:
    name: Build Debug APK & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK (API 35)
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -r | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "Error: sdkmanager not found under $SDK_ROOT/cmdline-tools" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Generate google-services.json
        shell: bash
        run: |
          cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "237357970564",
              "project_id": "smartstudyguadian",
              "storage_bucket": "smartstudyguadian.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:237357970564:android:df09f5f11798d5770bfed1",
                  "android_client_info": {
                    "package_name": "com.studyguardian.ai"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "237357970564-20fegsf1ehp070mbi5v4kam19jo2gnh1.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyB8qXBVA5jrv5BkKTaSuGoaotvgjwLPnJI"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Verify Debug Keystore & Print Fingerprints
        shell: bash
        run: |
          if [ ! -f app/debug.keystore ]; then
            keytool -genkey -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "=== ANDROID DEBUG SIGNING FINGERPRINTS ==="
          keytool -list -v -keystore app/debug.keystore -alias androiddebugkey -storepass android | grep -E "(SHA1|SHA256):" || true
          SHA1_VAL=$(keytool -list -v -keystore app/debug.keystore -alias androiddebugkey -storepass android | grep "SHA1:" | head -n 1 | awk '{print $2}' || true)
          SHA256_VAL=$(keytool -list -v -keystore app/debug.keystore -alias androiddebugkey -storepass android | grep "SHA256:" | head -n 1 | awk '{print $2}' || true)
          echo "### 🔑 Android Debug Fingerprints for Firebase" >> $GITHUB_STEP_SUMMARY
          echo "- **Package Name:** \`com.studyguardian.ai\`" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA-1:** \`$SHA1_VAL\`" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA-256:** \`$SHA256_VAL\`" >> $GITHUB_STEP_SUMMARY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v6
        if: success()
        with:
          name: smart-study-guardian-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          compression-level: 0
          retention-days: 30

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Upload Unit Test Reports
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

  release-build:
    name: Build Release APK & AAB
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.build_release == true
    needs: debug-build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK (API 35)
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -r | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "Error: sdkmanager not found under $SDK_ROOT/cmdline-tools" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Generate google-services.json
        shell: bash
        run: |
          cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "237357970564",
              "project_id": "smartstudyguadian",
              "storage_bucket": "smartstudyguadian.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:237357970564:android:df09f5f11798d5770bfed1",
                  "android_client_info": {
                    "package_name": "com.studyguardian.ai"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "237357970564-20fegsf1ehp070mbi5v4kam19jo2gnh1.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyB8qXBVA5jrv5BkKTaSuGoaotvgjwLPnJI"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Release Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > release-keystore.jks
            echo "ANDROID_KEYSTORE_PATH=$(pwd)/release-keystore.jks" >> "$GITHUB_ENV"
            echo "- **Release Signing:** Production Release Keystore (Play Store Ready)" >> $GITHUB_STEP_SUMMARY
          else
            if [ ! -f app/debug.keystore ]; then
              keytool -genkey -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
            echo "- **Release Signing:** Debug fallback keystore (directly installable for testing; add KEYSTORE_BASE64 secret before Play Store submission)" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Build Release APK & Play Store AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
          ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
          ADMOB_NATIVE_ID: ${{ secrets.ADMOB_NATIVE_ID }}
          AI_BACKEND_URL: ${{ secrets.AI_BACKEND_URL }}
        run: gradle assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Cleanup Keystore
        id: cleanup
        if: always()
        run: rm -f release-keystore.jks

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v6
        if: success()
        with:
          name: smart-study-guardian-release-apk
          path: app/build/outputs/apk/release/*.apk
          compression-level: 0
          retention-days: 30

      - name: Upload Play Store AAB Artifact
        uses: actions/upload-artifact@v6
        if: success()
        with:
          name: smart-study-guardian-playstore-aab
          path: app/build/outputs/bundle/release/*.aab
          compression-level: 0
          retention-days: 30

  publish-release:
    name: Publish Direct APK Downloads (GitHub Release)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [ debug-build-and-test, release-build ]
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download Debug APK
        uses: actions/download-artifact@v4
        with:
          name: smart-study-guardian-debug-apk
          path: dist-apks/debug

      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: smart-study-guardian-release-apk
          path: dist-apks/release

      - name: Download Play Store AAB
        uses: actions/download-artifact@v4
        with:
          name: smart-study-guardian-playstore-aab
          path: dist-apks/aab

      - name: Prepare Direct APK & AAB Files
        shell: bash
        run: |
          mkdir -p release-files
          DEBUG_APK=$(find dist-apks/debug -name "*.apk" | head -n 1)
          RELEASE_APK=$(find dist-apks/release -name "*.apk" | head -n 1)
          RELEASE_AAB=$(find dist-apks/aab -name "*.aab" | head -n 1)
          if [ -n "$DEBUG_APK" ]; then cp "$DEBUG_APK" release-files/Smart-Study-Guardian-debug.apk; fi
          if [ -n "$RELEASE_APK" ]; then cp "$RELEASE_APK" release-files/Smart-Study-Guardian-release.apk; fi
          if [ -n "$RELEASE_AAB" ]; then cp "$RELEASE_AAB" release-files/Smart-Study-Guardian-playstore.aab; fi
          ls -lh release-files/

      - name: Publish Direct APKs to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if gh release view latest-apk >/dev/null 2>&1; then
            gh release upload latest-apk release-files/* --clobber || echo "::warning::Could not update GitHub Release (enable Read and write permissions in Repo Settings -> Actions -> Workflow permissions)."
          else
            gh release create latest-apk release-files/* \
              --title "Smart Study Guardian — Direct APK & AAB Downloads" \
              --notes "Download .apk directly on Android without extracting any ZIP file." \
              --target "${{ github.sha }}" || echo "::warning::Could not create GitHub Release (enable Read and write permissions in Repo Settings -> Actions -> Workflow permissions)."
          fi
